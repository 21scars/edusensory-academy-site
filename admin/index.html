<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Site editor · EduSensory Online Academy</title>
<style>
:root{--ink:#1f3a2c;--green:#385a45;--line:#d6dfd8;--bg:#f6f8f5}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
.w{max-width:820px;margin:0 auto;padding:20px}
h1{font-size:1.5rem;margin:0 0 4px}.sub{color:#5b6b61;margin:0 0 18px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
label{display:block;font-weight:600;font-size:.9rem;margin:10px 0 4px}
input,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit}
textarea{min-height:44px;resize:vertical}
button{background:var(--green);color:#fff;border:0;border-radius:999px;padding:11px 20px;font:inherit;font-weight:700;cursor:pointer}
button.sec{background:#fff;color:var(--ink);border:1px solid var(--ink)}
.bar{position:sticky;top:0;background:var(--bg);padding:10px 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center;z-index:2}
.bar input{flex:1;min-width:160px}
.sec-t{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--green);margin:22px 0 6px;font-weight:800}
.chg textarea{border-color:#e0a800;background:#fffbea}
#msg{font-weight:600}.err{color:#b3261e}.ok{color:#1a7f37}small{color:#5b6b61}
</style></head><body><div class="w">
<h1>Site editor</h1><p class="sub">Edit the words on the public page. Changes save straight to GitHub and go live in about a minute.</p>
<div id="login" class="card">
<label>GitHub username</label><input id="owner" value="21scars">
<label>Repository</label><input id="repo" value="edusensory-academy-site">
<label>Branch</label><input id="branch" value="main">
<label>Access token <small>(fine-grained token with Contents: read and write for this repository only. Kept only in this browser tab.)</small></label>
<input id="token" type="password" autocomplete="off">
<p><button id="go">Open editor</button></p><p id="msg"></p></div>
<div id="ed" hidden>
<div class="bar"><input id="q" placeholder="Search text…"><button id="save">Save changes</button><button class="sec" id="out">Sign out</button></div>
<p id="msg2"></p><div id="list"></div></div>
</div>
<script>
var $=function(i){return document.getElementById(i)},cfg={},data=null,sha=null,orig={};
function b64d(s){return decodeURIComponent(escape(atob(s.replace(/\n/g,''))))}
function b64e(s){return btoa(unescape(encodeURIComponent(s)))}
function api(p,o){o=o||{};o.headers=Object.assign({Authorization:'Bearer '+cfg.token,Accept:'application/vnd.github+json'},o.headers||{});
 return fetch('https://api.github.com/repos/'+cfg.owner+'/'+cfg.repo+'/contents/'+p,o)}
function say(id,t,c){var e=$(id);e.textContent=t;e.className=c||''}
async function load(){
 var r=await api('content.json?ref='+encodeURIComponent(cfg.branch));
 if(!r.ok)throw new Error(r.status==401||r.status==403?'Token not accepted for this repository.':r.status==404?'content.json not found. Check the repository and branch.':'GitHub error '+r.status);
 var j=await r.json();sha=j.sha;data=JSON.parse(b64d(j.content));orig={};
 data.fields.forEach(function(f){orig[f.key]=f.value});render()}
function render(){
 var l=$('list');l.innerHTML='';var last='';
 data.fields.forEach(function(f){
  if(f.section!==last){last=f.section;var h=document.createElement('div');h.className='sec-t';h.textContent=f.section;l.appendChild(h)}
  var d=document.createElement('div');d.className='card';d.dataset.k=f.key;d.dataset.s=f.value.toLowerCase();
  var t=document.createElement('textarea');t.value=f.value;t.rows=f.value.length>90?3:1;
  t.oninput=function(){f.value=t.value;d.classList.toggle('chg',f.value!==orig[f.key]);d.dataset.s=f.value.toLowerCase()};
  d.appendChild(t);l.appendChild(d)})}
$('q').oninput=function(){var q=this.value.toLowerCase();document.querySelectorAll('#list .card').forEach(function(c){c.hidden=q&&c.dataset.s.indexOf(q)<0})};
$('go').onclick=async function(){
 cfg={owner:$('owner').value.trim(),repo:$('repo').value.trim(),branch:$('branch').value.trim(),token:$('token').value.trim()};
 if(!cfg.token){say('msg','Paste your access token first.','err');return}
 say('msg','Opening…');
 try{await load();sessionStorage.setItem('cms',JSON.stringify(cfg));$('login').hidden=true;$('ed').hidden=false}catch(e){say('msg',e.message,'err')}};
$('save').onclick=async function(){
 var n=data.fields.filter(function(f){return f.value!==orig[f.key]}).length;
 if(!n){say('msg2','No changes to save.');return}
 say('msg2','Saving…');
 var r=await api('content.json',{method:'PUT',body:JSON.stringify({message:'Update site text ('+n+' changes)',branch:cfg.branch,sha:sha,content:b64e(JSON.stringify(data,null,1))})});
 if(r.ok){var j=await r.json();sha=j.content.sha;data.fields.forEach(function(f){orig[f.key]=f.value});document.querySelectorAll('.chg').forEach(function(c){c.classList.remove('chg')});say('msg2','Saved. The live site updates in about a minute.','ok')}
 else say('msg2',r.status==409?'Someone else changed the file. Reload and try again.':'Save failed ('+r.status+').','err')};
$('out').onclick=function(){sessionStorage.removeItem('cms');location.reload()};
(function(){var s=sessionStorage.getItem('cms');if(s){cfg=JSON.parse(s);load().then(function(){$('login').hidden=true;$('ed').hidden=false}).catch(function(){})}})();
</script></body></html>
